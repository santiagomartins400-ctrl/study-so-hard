name: Build Windows

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  APP_VERSION: "1.7.0"

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Obter o código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Instalar dependências
        working-directory: desktop
        run: npm install

      - name: Copiar a aplicação para o desktop
        shell: bash
        run: |
          mkdir -p desktop/app
          cp app.html desktop/app/app.html

      - name: Gerar o instalador
        working-directory: desktop
        run: npm run build:win

      - name: Criar a release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          TAG="v${APP_VERSION}"
          gh release create "$TAG" \
            "desktop/dist/Lumen-Study-Setup-${APP_VERSION}.exe" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Lumen Study ${TAG}" \
            --notes "Instalador para Windows da versão ${APP_VERSION}." \
            --latest
